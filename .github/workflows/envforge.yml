name: EnvForge

on:
  pull_request:
    paths: ["envforge/**", "apps/**", "deploy/**", "pyproject.toml", "uv.lock", ".github/workflows/envforge.yml"]
  push:
    branches: [main]
    paths: ["envforge/**", "apps/**", "deploy/**", "pyproject.toml", "uv.lock", ".github/workflows/envforge.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVFORGE_DB_PATH: ${{ runner.temp }}/envforge-tests.sqlite3
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --project apps/api --locked
      - name: SRE and API regression checks
        run: uv run --project apps/api pytest tests/unit/test_api.py tests/unit/test_sre_world.py tests/adversarial/test_sre_adversarial.py
      - name: Scenario and verifier QA
        run: uv run envforge qa --instances 50 --repeats 20 --output data/qa-report.json
      - name: Dashboard checks
        working-directory: apps/web
        run: |
          npm ci --include=optional
          npm run lint
          npm run build
      - name: Deployment smoke check
        env:
          ENVFORGE_API_TOKEN: ci-local-validation-only
        run: |
          docker compose -f deploy/compose.yaml up --build -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8080/health
          docker compose -f deploy/compose.yaml exec -T worker uv run --no-project --no-sync envforge smoke
      - name: Deployment diagnostics
        if: failure()
        env:
          ENVFORGE_API_TOKEN: ci-local-validation-only
        run: docker compose -f deploy/compose.yaml logs --tail 100
      - name: Stop deployment
        if: always()
        env:
          ENVFORGE_API_TOKEN: ci-local-validation-only
        run: docker compose -f deploy/compose.yaml down

  postgres-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: envforge_ci_admin
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: envforge_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U envforge_ci_admin -d envforge_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --project apps/api --locked
      - name: Provision restricted application owner
        run: |
          uv run --project apps/api python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://envforge_ci_admin:ephemeral-ci-only@127.0.0.1:5432/envforge_ci", autocommit=True) as connection:
              connection.execute("CREATE ROLE envforge_ci_app LOGIN PASSWORD 'ephemeral-app-only' NOSUPERUSER NOCREATEDB NOCREATEROLE")
              connection.execute("CREATE DATABASE envforge_api_tests OWNER envforge_ci_app")
          PY
      - name: Existing API workflow against PostgreSQL
        env:
          ENVFORGE_DATABASE_URL: postgresql://envforge_ci_app:ephemeral-app-only@127.0.0.1:5432/envforge_api_tests
        run: uv run --project apps/api pytest tests/unit/test_api.py
