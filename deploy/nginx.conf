server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location /health { proxy_pass http://api:8000; }
    location /ready { proxy_pass http://api:8000; }
    location /auth/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
